<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Strong by Lee</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 48px 32px;
      background: var(--black);
    }
    .error-number {
      font-family: 'Playfair Display', serif;
      font-size: 8rem; font-weight: 900;
      color: var(--accent); line-height: 1;
      margin-bottom: 16px; opacity: 0.4;
    }
    .error-page h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem; font-weight: 700;
      color: #fff; margin-bottom: 16px;
    }
    .error-page h1 em { color: var(--accent); font-style: italic; }
    .error-page p {
      color: rgba(255,255,255,0.5); font-size: 1rem;
      max-width: 440px; line-height: 1.7; margin-bottom: 40px;
    }
    .error-links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-number">404</div>
    <h1>This page doesn't exist.<br/><em>Yet.</em></h1>
    <p>Whatever you were looking for isn't here. But the good stuff is — try one of these instead.</p>
    <div class="error-links">
      <a href="index.html" class="btn-primary">Go Home</a>
      <a href="contact.html" class="btn-ghost" style="color:#fff; border-color:#fff;">Book a Consultation</a>
    </div>
  </div>
</body>
</html>
